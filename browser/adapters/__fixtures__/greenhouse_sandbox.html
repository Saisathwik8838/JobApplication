<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Greenhouse Sandbox - Senior Backend Engineer</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 2rem auto; max-width: 650px; color: #333; line-height: 1.5; }
    header { border-bottom: 2px solid #00b274; padding-bottom: 1rem; margin-bottom: 1.5rem; }
    label { display: block; margin-top: 1.25rem; font-weight: 600; font-size: 0.95rem; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 0.6rem; margin-top: 0.35rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button[type="submit"] { margin-top: 1.75rem; padding: 0.8rem 1.8rem; background: #008552; color: #fff; font-size: 1.05rem; font-weight: 600; border: 0; border-radius: 4px; cursor: pointer; }
    button[type="submit"]:hover { background: #006b42; }
    #confirmation { display: none; background: #e8f5e9; border: 1px solid #c8e6c9; color: #2e7d32; padding: 1.5rem; margin-top: 1.5rem; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <h1 style="margin: 0; font-size: 1.6rem;">Acme Cloud Systems</h1>
    <h2 style="margin: 0.25rem 0 0 0; font-size: 1.2rem; color: #555;">Senior Distributed Systems Engineer</h2>
    <p style="margin: 0.25rem 0 0 0; color: #777;">Remote • Full-time • Engineering</p>
  </header>
  <main>
    <form id="application_form" onsubmit="event.preventDefault(); document.getElementById('confirmation').style.display='block'; window.location.hash='submitted';">
      <label for="first_name">First Name</label>
      <input id="first_name" name="first_name" autocomplete="given-name" required />

      <label for="last_name">Last Name</label>
      <input id="last_name" name="last_name" autocomplete="family-name" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />

      <label for="phone">Phone</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" />

      <label for="skills">What programming languages do you know?</label>
      <input id="skills" name="skills" required />

      <label for="experience">Years of experience</label>
      <input id="experience" name="experience" required />

      <div id="resume_fieldset" style="margin-top: 1.25rem;">
        <label for="resume">Resume / CV</label>
        <input id="resume" name="resume" type="file" />
      </div>

      <button id="submit_app" type="submit">Submit application</button>
    </form>
    <div id="confirmation">
      <h3 style="margin-top: 0;">Application Submitted!</h3>
      <p>Thank you for your interest in Acme Cloud Systems. Your application has been submitted.</p>
    </div>
  </main>
</body>
</html>
